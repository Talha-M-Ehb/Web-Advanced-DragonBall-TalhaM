<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DragonDex - Dragon Ball Character Universe</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <header class="navbar">
      <div class="container">
        <h1>DragonDex</h1>
        <nav>
          <!-- Navigation will be added here later -->
        </nav>
      </div>
    </header>

    <main class="container">
      <section id="controls" class="controls-section">
        <div class="search-container">
          <input type="text" id="search-input" placeholder="Search characters by name..." class="search-input" />
        </div>
        <div class="filters-container">
          <select id="sort-filter" class="filter-select">
            <option value="default">Sort By: Default</option>
            <option value="name-asc">Name (A - Z)</option>
            <option value="name-desc">Name (Z - A)</option>
            <option value="ki-asc">Base Ki (Low to High)</option>
            <option value="ki-desc">Base Ki (High to Low)</option>
          </select>
          <select id="race-filter" class="filter-select">
            <option value="">All Races</option>
            <option value="Saiyan">Saiyan</option>
            <option value="Human">Human</option>
            <option value="Namekian">Namekian</option>
            <option value="Majin">Majin</option>
            <option value="Frieza Race">Frieza Race</option>
            <option value="Android">Android</option>
            <option value="God">God</option>
            <option value="Angel">Angel</option>
            <option value="Unknown">Unknown</option>
          </select>
          <select id="gender-filter" class="filter-select">
            <option value="">All Genders</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Unknown">Unknown</option>
          </select>
          <select id="affiliation-filter" class="filter-select">
            <option value="">All Affiliations</option>
            <option value="Z Fighter">Z Fighter</option>
            <option value="Army of Frieza">Army of Frieza</option>
            <option value="Freelancer">Freelancer</option>
            <option value="Pride Trooper">Pride Trooper</option>
            <option value="Assistant of Vermoud">Assistant of Vermoud</option>
            <option value="God of Destruction">God of Destruction</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </section>

      <section id="characters-grid" class="grid-container">
        <!-- Character cards will be injected here -->
      </section>
    </main>

    <div id="modal-container" class="modal-overlay hidden">
      <!-- Modal content will go here -->
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
